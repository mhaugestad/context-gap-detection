[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decontextualisation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "lightning>=2.4", "transformers>=4.45", "datasets>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
